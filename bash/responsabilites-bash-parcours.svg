<svg viewBox="0 0 1080 830" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title>Les responsabilités de bash, dans l'ordre où l'utilisateur les rencontre</title>
  <desc>Parcours vertical en huit étapes regroupées en cinq phases : mise en place (environnement), interaction (ligne de commande), exécuter une ligne (lancement, expansions, redirections et tubes), gérer (job control), automatiser (orchestration, signaux).</desc>

  <defs>
    <style>
      .title    { font-size: 22px; font-weight: 700; fill: #1b1f2a; }
      .subtitle { font-size: 13.5px; fill: #565d6d; }
      .ctitle   { font-size: 13.5px; font-weight: 700; fill: #1b1f2a; }
      .cex      { font-family: Consolas, 'DejaVu Sans Mono', Menlo, monospace; font-size: 11.5px; fill: #39404f; }
      .cnum     { font-size: 12px; font-weight: 700; fill: #ffffff; }
      .badge    { font-size: 10.5px; font-weight: 700; fill: #ffffff; }
      .pnum     { font-size: 11px; font-weight: 700; fill: #ffffff; }
      .plabel   { font-size: 12.5px; font-weight: 700; fill: #2b3140; }
      .pcap     { font-size: 10.5px; fill: #767c8a; }
      .foot     { font-size: 12.5px; fill: #39404f; }
      .mono     { font-family: Consolas, 'DejaVu Sans Mono', Menlo, monospace; }
    </style>
    <filter id="soft" x="-4%" y="-12%" width="108%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#1b1f2a" flood-opacity="0.10"/>
    </filter>
    <marker id="railEnd" markerWidth="12" markerHeight="12" refX="6" refY="9" orient="auto">
      <path d="M1,1 L6,9 L11,1" fill="none" stroke="#9aa0ad" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="830" fill="#ffffff"/>

  <text x="540" y="40" text-anchor="middle" class="title">Les responsabilités de bash — dans l'ordre rencontré</text>
  <text x="540" y="64" text-anchor="middle" class="subtitle">Du transparent au piloté&#160;: ce que bash prépare pour moi &#8594; ce que je lui demande &#8594; ce qu'il exécute seul.</text>

  <!-- ===== PHASE BARS + LABELS (left) ===== -->
  <g>
    <!-- phase 1 -->
    <rect x="236" y="110" width="5" height="66" rx="2.5" fill="#a7adba"/>
    <circle cx="88" cy="137" r="11" fill="#8a90a0"/><text x="88" y="141" text-anchor="middle" class="pnum">1</text>
    <text x="106" y="136" class="plabel">Mise en place</text>
    <text x="106" y="151" class="pcap">transparent, avant la 1re touche</text>
    <!-- phase 2 -->
    <rect x="236" y="190" width="5" height="66" rx="2.5" fill="#a7adba"/>
    <circle cx="88" cy="217" r="11" fill="#8a90a0"/><text x="88" y="221" text-anchor="middle" class="pnum">2</text>
    <text x="106" y="221" class="plabel">Interaction</text>
    <!-- phase 3 -->
    <rect x="236" y="270" width="5" height="226" rx="2.5" fill="#a7adba"/>
    <circle cx="88" cy="380" r="11" fill="#8a90a0"/><text x="88" y="384" text-anchor="middle" class="pnum">3</text>
    <text x="106" y="379" class="plabel">Exécuter une ligne</text>
    <text x="106" y="394" class="pcap">une seule machine&#160;: 3 · 4 · 5</text>
    <!-- phase 4 -->
    <rect x="236" y="510" width="5" height="66" rx="2.5" fill="#a7adba"/>
    <circle cx="88" cy="543" r="11" fill="#8a90a0"/><text x="88" y="547" text-anchor="middle" class="pnum">4</text>
    <text x="106" y="547" class="plabel">Gérer l'exécution</text>
    <!-- phase 5 -->
    <rect x="236" y="590" width="5" height="146" rx="2.5" fill="#a7adba"/>
    <circle cx="88" cy="656" r="11" fill="#8a90a0"/><text x="88" y="660" text-anchor="middle" class="pnum">5</text>
    <text x="106" y="655" class="plabel">Automatiser</text>
    <text x="106" y="670" class="pcap">le régime batch</text>
  </g>

  <!-- ===== RAIL ===== -->
  <line x1="257" y1="143" x2="257" y2="700" stroke="#c7ccd6" stroke-width="2" marker-end="url(#railEnd)"/>
  <g fill="#c7ccd6">
    <circle cx="257" cy="143" r="4"/><circle cx="257" cy="223" r="4"/><circle cx="257" cy="303" r="4"/><circle cx="257" cy="383" r="4"/>
    <circle cx="257" cy="463" r="4"/><circle cx="257" cy="543" r="4"/><circle cx="257" cy="623" r="4"/><circle cx="257" cy="703" r="4"/>
  </g>

  <!-- ============ CARDS (x=280, w=600, h=66, pitch 80) ============ -->

  <!-- 1 Environnement & session  [ajout] les deux -->
  <g filter="url(#soft)"><rect x="280" y="110" width="600" height="66" rx="11" fill="#f7f8fb" stroke="#d3d7e0" stroke-width="1.3"/></g>
  <rect x="281.5" y="111.5" width="597" height="63" rx="10" fill="none" stroke="#c07d18" stroke-width="1.4" stroke-dasharray="5 4"/>
  <circle cx="305" cy="143" r="13" fill="#5b52c4"/><text x="305" y="147" text-anchor="middle" class="cnum">1</text>
  <text x="328" y="139" class="ctitle">Environnement &amp; session</text>
  <text x="328" y="159" class="cex">export · PATH · cd · set/shopt · .bashrc</text>
  <rect x="712" y="134" width="66" height="18" rx="9" fill="#5b52c4"/><text x="745" y="147" text-anchor="middle" class="badge">les deux</text>
  <rect x="790" y="134" width="60" height="18" rx="9" fill="#c07d18"/><text x="820" y="147" text-anchor="middle" class="badge" font-size="10">+ ajout</text>

  <!-- 2 Ligne de commande interactive  interactif -->
  <g filter="url(#soft)"><rect x="280" y="190" width="600" height="66" rx="11" fill="#f7f8fb" stroke="#d3d7e0" stroke-width="1.3"/></g>
  <circle cx="305" cy="223" r="13" fill="#2f6f9f"/><text x="305" y="227" text-anchor="middle" class="cnum">2</text>
  <text x="328" y="219" class="ctitle">Ligne de commande interactive</text>
  <text x="328" y="239" class="cex">readline · historique · complétion · invite (prompt)</text>
  <rect x="712" y="214" width="66" height="18" rx="9" fill="#2f6f9f"/><text x="745" y="227" text-anchor="middle" class="badge">interactif</text>

  <!-- 3 Lancement & résolution  les deux -->
  <g filter="url(#soft)"><rect x="280" y="270" width="600" height="66" rx="11" fill="#f7f8fb" stroke="#d3d7e0" stroke-width="1.3"/></g>
  <circle cx="305" cy="303" r="13" fill="#5b52c4"/><text x="305" y="307" text-anchor="middle" class="cnum">3</text>
  <text x="328" y="299" class="ctitle">Lancement &amp; résolution</text>
  <text x="328" y="319" class="cex">alias &#8594; fonction &#8594; builtin &#8594; PATH · fork()+exec()</text>
  <rect x="712" y="294" width="66" height="18" rx="9" fill="#5b52c4"/><text x="745" y="307" text-anchor="middle" class="badge">les deux</text>

  <!-- 4 Expansions  les deux -->
  <g filter="url(#soft)"><rect x="280" y="350" width="600" height="66" rx="11" fill="#f7f8fb" stroke="#d3d7e0" stroke-width="1.3"/></g>
  <circle cx="305" cy="383" r="13" fill="#5b52c4"/><text x="305" y="387" text-anchor="middle" class="cnum">4</text>
  <text x="328" y="379" class="ctitle">Expansions</text>
  <text x="328" y="399" class="cex">$var · {a,b} · ~ · *?[] · $(…) · $((…)) · découpage en mots</text>
  <rect x="712" y="374" width="66" height="18" rx="9" fill="#5b52c4"/><text x="745" y="387" text-anchor="middle" class="badge">les deux</text>

  <!-- 5 Redirections & tubes  [ajout] les deux -->
  <g filter="url(#soft)"><rect x="280" y="430" width="600" height="66" rx="11" fill="#f7f8fb" stroke="#d3d7e0" stroke-width="1.3"/></g>
  <rect x="281.5" y="431.5" width="597" height="63" rx="10" fill="none" stroke="#c07d18" stroke-width="1.4" stroke-dasharray="5 4"/>
  <circle cx="305" cy="463" r="13" fill="#5b52c4"/><text x="305" y="467" text-anchor="middle" class="cnum">5</text>
  <text x="328" y="459" class="ctitle">Redirections &amp; tubes</text>
  <text x="328" y="479" class="cex">| · &gt; &gt;&gt; &lt; · 2&gt;&amp;1 · here-doc &lt;&lt; · &lt;(…)</text>
  <rect x="712" y="454" width="66" height="18" rx="9" fill="#5b52c4"/><text x="745" y="467" text-anchor="middle" class="badge">les deux</text>
  <rect x="790" y="454" width="60" height="18" rx="9" fill="#c07d18"/><text x="820" y="467" text-anchor="middle" class="badge" font-size="10">+ ajout</text>

  <!-- 6 Processus & job control  interactif -->
  <g filter="url(#soft)"><rect x="280" y="510" width="600" height="66" rx="11" fill="#f7f8fb" stroke="#d3d7e0" stroke-width="1.3"/></g>
  <circle cx="305" cy="543" r="13" fill="#2f6f9f"/><text x="305" y="547" text-anchor="middle" class="cnum">6</text>
  <text x="328" y="539" class="ctitle">Processus &amp; job control</text>
  <text x="328" y="559" class="cex">&amp; · fg · bg · jobs · ^Z suspend · kill · wait</text>
  <rect x="712" y="534" width="66" height="18" rx="9" fill="#2f6f9f"/><text x="745" y="547" text-anchor="middle" class="badge">interactif</text>

  <!-- 7 Orchestration  batch -->
  <g filter="url(#soft)"><rect x="280" y="590" width="600" height="66" rx="11" fill="#f7f8fb" stroke="#d3d7e0" stroke-width="1.3"/></g>
  <circle cx="305" cy="623" r="13" fill="#2f8f6b"/><text x="305" y="627" text-anchor="middle" class="cnum">7</text>
  <text x="328" y="619" class="ctitle">Orchestration</text>
  <text x="328" y="639" class="cex">if · for · while · case · fonctions · &amp;&amp; || · $?</text>
  <rect x="712" y="614" width="50" height="18" rx="9" fill="#2f8f6b"/><text x="737" y="627" text-anchor="middle" class="badge">batch</text>

  <!-- 8 Signaux & nettoyage  [ajout] batch -->
  <g filter="url(#soft)"><rect x="280" y="670" width="600" height="66" rx="11" fill="#f7f8fb" stroke="#d3d7e0" stroke-width="1.3"/></g>
  <rect x="281.5" y="671.5" width="597" height="63" rx="10" fill="none" stroke="#c07d18" stroke-width="1.4" stroke-dasharray="5 4"/>
  <circle cx="305" cy="703" r="13" fill="#2f8f6b"/><text x="305" y="707" text-anchor="middle" class="cnum">8</text>
  <text x="328" y="699" class="ctitle">Signaux &amp; nettoyage</text>
  <text x="328" y="719" class="cex">trap · nettoyage sur EXIT / INT / TERM · robustesse</text>
  <rect x="712" y="694" width="50" height="18" rx="9" fill="#2f8f6b"/><text x="737" y="707" text-anchor="middle" class="badge">batch</text>
  <rect x="790" y="694" width="60" height="18" rx="9" fill="#c07d18"/><text x="820" y="707" text-anchor="middle" class="badge" font-size="10">+ ajout</text>

  <!-- ===== FOOTER / LEGEND ===== -->
  <line x1="60" y1="762" x2="1020" y2="762" stroke="#e4e7ee" stroke-width="1.2"/>
  <rect x="60" y="776" width="14" height="14" rx="3" fill="#2f6f9f"/><text x="80" y="788" class="foot">interactif</text>
  <rect x="170" y="776" width="14" height="14" rx="3" fill="#2f8f6b"/><text x="190" y="788" class="foot">batch</text>
  <rect x="258" y="776" width="14" height="14" rx="3" fill="#5b52c4"/><text x="278" y="788" class="foot">les deux</text>
  <rect x="376" y="776" width="14" height="14" rx="3" fill="none" stroke="#c07d18" stroke-width="1.5" stroke-dasharray="4 3"/><text x="396" y="788" class="foot">compléments (1 · 5 · 8)</text>
  <text x="1020" y="788" text-anchor="end" class="foot" font-style="italic">Phase 3 : un seul « Entrée » déclenche 3 · 4 · 5</text>
</svg>
