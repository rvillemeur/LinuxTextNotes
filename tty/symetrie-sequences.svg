<svg viewBox="0 0 1140 940" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title>La symétrie des séquences d'échappement : entrée / sortie</title>
  <desc>La même syntaxe ANSI (CSI = ESC [) sert à commander l'affichage (sortie, application vers écran) et à encoder les touches spéciales et les rapports (entrée, terminal vers application). La paire ESC [ 6 ; 10 H (ordre) et ESC [ 6 ; 10 R (constat) montre que seule la lettre finale change.</desc>

  <defs>
    <style>
      .title    { font-size: 21px; font-weight: 700; fill: #1b1f2a; }
      .subtitle { font-size: 13px; fill: #565d6d; }
      .btitle   { font-size: 15.5px; font-weight: 700; }
      .stitle   { font-size: 12.5px; font-weight: 700; fill: #3a3f4c; }
      .cap      { font-size: 11px; fill: #6b7180; }
      .body     { font-size: 12px; fill: #2b3140; }
      .mono     { font-family: Consolas, 'DejaVu Sans Mono', Menlo, monospace; }
      .chipc    { font-size: 13px; font-weight: 600; }
      .chipg    { font-size: 10.5px; fill: #6b7180; }
    </style>
    <filter id="soft" x="-6%" y="-8%" width="112%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#1b1f2a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1140" height="940" fill="#ffffff"/>

  <text x="570" y="42" text-anchor="middle" class="title">La symétrie des séquences : une grammaire, deux sens</text>
  <text x="570" y="66" text-anchor="middle" class="subtitle">La même syntaxe ANSI décrit l'écran et encode le clavier &#8212; ordres vers l'écran, constats vers le programme.</text>

  <!-- ===== SORTIE (amber) ===== -->
  <g filter="url(#soft)"><rect x="80" y="92" width="980" height="156" rx="12" fill="#fbf4e8" stroke="#c07d18" stroke-width="1.5"/></g>
  <rect x="80" y="92" width="6" height="156" rx="3" fill="#c07d18"/>
  <text x="104" y="120" class="btitle" fill="#9a6410">SORTIE &#8212; l'application commande l'écran</text>
  <text x="104" y="140" class="cap">Registre <tspan font-weight="700">impératif</tspan> : «&#160;fais ceci&#160;».</text>

  <g>
    <rect x="104" y="158" width="207" height="46" rx="8" fill="#ffffff" stroke="#e6cfa6"/>
    <text x="116" y="182" class="mono chipc" fill="#9a6410">\e[2J</text><text x="116" y="198" class="chipg">efface tout l'écran</text>
    <rect x="323" y="158" width="207" height="46" rx="8" fill="#ffffff" stroke="#e6cfa6"/>
    <text x="335" y="182" class="mono chipc" fill="#9a6410">\e[H</text><text x="335" y="198" class="chipg">curseur en haut à gauche</text>
    <rect x="542" y="158" width="207" height="46" rx="8" fill="#ffffff" stroke="#e6cfa6"/>
    <text x="554" y="182" class="mono chipc" fill="#9a6410">\e[1;31m</text><text x="554" y="198" class="chipg">rouge gras (SGR)</text>
    <rect x="761" y="158" width="207" height="46" rx="8" fill="#ffffff" stroke="#e6cfa6"/>
    <text x="773" y="182" class="mono chipc" fill="#9a6410">\e[10;40H</text><text x="773" y="198" class="chipg">place le curseur en (10,40)</text>
  </g>
  <text x="104" y="232" class="cap">Le texte ordinaire, lui, part tel quel : un octet = un glyphe. Seuls les <tspan font-weight="700">ordres</tspan> prennent la forme d'une séquence.</text>

  <!-- ===== CENTRE : la grammaire partagée (violet) ===== -->
  <g filter="url(#soft)"><rect x="80" y="268" width="980" height="300" rx="12" fill="#f4f3fc" stroke="#5b52c4" stroke-width="1.5"/></g>
  <rect x="80" y="268" width="980" height="6" rx="3" fill="#5b52c4"/>
  <text x="570" y="298" text-anchor="middle" class="btitle" fill="#3a338f">Une seule grammaire : la séquence de contrôle (CSI)</text>

  <line x1="558" y1="318" x2="558" y2="548" stroke="#ded9f5" stroke-width="1.4"/>

  <!-- Left : anatomie -->
  <text x="104" y="326" class="stitle">Anatomie d'une séquence</text>
  <g class="mono" font-size="15" fill="#3a338f" font-weight="700">
    <text x="118" y="360">ESC</text>
    <text x="118" y="392">[</text>
    <text x="118" y="424">n ; m</text>
    <text x="118" y="456">lettre</text>
  </g>
  <g class="body">
    <text x="210" y="360">l'introducteur (octet 0x1B)</text>
    <text x="210" y="392">CSI &#8212; Control Sequence Introducer</text>
    <text x="210" y="424">les paramètres, séparés par «&#160;;&#160;»</text>
    <text x="210" y="456">l'octet final : <tspan font-weight="700">l'action</tspan></text>
  </g>
  <text x="104" y="498" class="cap" font-style="italic">Même squelette pour toutes : ce qui change,</text>
  <text x="104" y="514" class="cap" font-style="italic">c'est la lettre finale et les paramètres.</text>

  <!-- Right : la même forme, deux sens -->
  <text x="584" y="326" class="stitle">La même forme, deux sens</text>
  <text x="584" y="352" class="cap">Syntaxe identique &#8212; seule la <tspan font-weight="700">lettre finale</tspan> (l'action) diffère :</text>

  <!-- row sortie -->
  <text x="584" y="392" class="mono" font-size="17" fill="#9a6410">ESC [ 6 ; 10</text>
  <rect x="726" y="374" width="30" height="26" rx="5" fill="#f6e3c4" stroke="#c07d18" stroke-width="1.4"/>
  <text x="741" y="393" text-anchor="middle" class="mono" font-size="17" font-weight="700" fill="#9a6410">H</text>
  <text x="770" y="392" class="body"><tspan fill="#9a6410" font-weight="700">ordre</tspan> : place le curseur en (6,10)</text>

  <!-- row entrée -->
  <text x="584" y="440" class="mono" font-size="17" fill="#2f6f9f">ESC [ 6 ; 10</text>
  <rect x="726" y="422" width="30" height="26" rx="5" fill="#dbeaf5" stroke="#2f6f9f" stroke-width="1.4"/>
  <text x="741" y="441" text-anchor="middle" class="mono" font-size="17" font-weight="700" fill="#2f6f9f">R</text>
  <text x="770" y="440" class="body"><tspan fill="#2f6f9f" font-weight="700">constat</tspan> : le curseur EST en (6,10)</text>

  <!-- bracket identique -->
  <path d="M584,404 L584,410 L706,410 L706,404" fill="none" stroke="#8a8fa0" stroke-width="1.1"/>
  <text x="645" y="424" text-anchor="middle" class="cap">identique</text>

  <!-- sondage in-band -->
  <rect x="584" y="494" width="452" height="56" rx="9" fill="#ffffff" stroke="#cfc9ee"/>
  <text x="598" y="514" class="cap"><tspan font-weight="700" fill="#3a338f">&#8645; Sondage in-band</tspan> &#8212; l'application demande <tspan class="mono" fill="#3a338f">ESC [ 6 n</tspan>,</text>
  <text x="598" y="532" class="cap">le terminal répond <tspan class="mono" fill="#2f6f9f">ESC [ 6 ; 10 R</tspan>. Même grammaire, dans l'autre sens :</text>
  <text x="598" y="546" class="cap">c'est ainsi qu'un programme lit l'état réel du terminal à l'exécution.</text>

  <!-- ===== ENTRÉE (blue) ===== -->
  <g filter="url(#soft)"><rect x="80" y="588" width="980" height="156" rx="12" fill="#eaf2f8" stroke="#2f6f9f" stroke-width="1.5"/></g>
  <rect x="80" y="588" width="6" height="156" rx="3" fill="#2f6f9f"/>
  <text x="104" y="616" class="btitle" fill="#245880">ENTRÉE &#8212; le terminal rapporte au programme</text>
  <text x="104" y="636" class="cap">Registre <tspan font-weight="700">constatif</tspan> : «&#160;ceci vient d'arriver&#160;».</text>

  <g>
    <rect x="104" y="654" width="207" height="46" rx="8" fill="#ffffff" stroke="#bcd3e5"/>
    <text x="116" y="678" class="mono chipc" fill="#245880">\e[A</text><text x="116" y="694" class="chipg">flèche haut</text>
    <rect x="323" y="654" width="207" height="46" rx="8" fill="#ffffff" stroke="#bcd3e5"/>
    <text x="335" y="678" class="mono chipc" fill="#245880">\e[3~</text><text x="335" y="694" class="chipg">touche Suppr</text>
    <rect x="542" y="654" width="207" height="46" rx="8" fill="#ffffff" stroke="#bcd3e5"/>
    <text x="554" y="678" class="mono chipc" fill="#245880">\e[&lt;0;12;7M</text><text x="554" y="694" class="chipg">clic souris (SGR)</text>
    <rect x="761" y="654" width="207" height="46" rx="8" fill="#ffffff" stroke="#bcd3e5"/>
    <text x="773" y="678" class="mono chipc" fill="#245880">\e[200~ … \e[201~</text><text x="773" y="694" class="chipg">collage entre crochets</text>
  </g>
  <text x="104" y="728" class="cap">Une touche ordinaire, elle, arrive en un seul octet. Seules les touches <tspan font-weight="700">spéciales</tspan> et les <tspan font-weight="700">rapports</tspan> deviennent des séquences.</text>

  <!-- ===== THÈSE ===== -->
  <rect x="80" y="764" width="980" height="120" rx="12" fill="#f7f5ee" stroke="#d9cfa8" stroke-width="1.4"/>
  <rect x="80" y="764" width="6" height="120" rx="3" fill="#b7902f"/>
  <text x="104" y="792" class="btitle" fill="#6e5a24">Une grammaire pauvre, partagée aux deux bouts</text>
  <text x="104" y="816" class="body">Le même alphabet minimal &#8212; ESC, un crochet, des nombres, une lettre &#8212; commande l'affichage <tspan font-style="italic">et</tspan> décrit l'entrée.</text>
  <text x="104" y="838" class="body">Ni l'écriture ni la lecture n'ont exigé d'accord préalable : chaque bout produit et consomme le même texte minimal.</text>
  <text x="104" y="860" class="body" font-weight="700" fill="#3a3f4c">La portée du commun, encore &#8212; plutôt que l'enfermement.</text>

  <text x="104" y="906" class="cap" font-style="italic">CSI = ESC [ (Control Sequence Introducer). Quelques touches passent par ESC O (SS3) ; OSC (ESC ]) suit le même principe &#8212; titres de fenêtre, sondage des couleurs.</text>
</svg>
