<svg viewBox="0 0 1080 1060" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title>Pile et flux de communication : tty, bash et application TUI</title>
  <desc>Schéma de la pile terminal (émulateur, PTY maître, discipline de ligne, PTY esclave, bash, application TUI) et du flux d'octets mêlant texte et séquences de contrôle envoyé vers l'affichage.</desc>

  <defs>
    <style>
      .title    { font-size: 22px; font-weight: 700; fill: #1b1f2a; }
      .subtitle { font-size: 13.5px; fill: #565d6d; }
      .boxtitle { font-size: 16.5px; font-weight: 700; fill: #1b1f2a; }
      .bullet   { font-size: 13px; fill: #2b3140; }
      .cap      { font-size: 11.5px; fill: #6b7180; }
      .mono     { font-family: Consolas, 'DejaVu Sans Mono', Menlo, monospace; }
      .conn     { font-size: 11.5px; fill: #565d6d; }
      .pill     { font-size: 11px; font-weight: 700; }
      .flank    { font-size: 13px; font-weight: 700; letter-spacing: .4px; }
    </style>
    <marker id="arrDown" markerWidth="12" markerHeight="12" refX="6" refY="9" orient="auto">
      <path d="M1,1 L6,9 L11,1" fill="none" stroke="#2f6f9f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrUp" markerWidth="12" markerHeight="12" refX="6" refY="3" orient="auto">
      <path d="M1,11 L6,3 L11,11" fill="none" stroke="#c07d18" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="dot" markerWidth="8" markerHeight="8" refX="4" refY="4">
      <circle cx="4" cy="4" r="3" fill="#8a90a0"/>
    </marker>
    <marker id="arrBi" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M2,2 L8,5 L2,8 Z" fill="#8a90a0"/>
    </marker>
    <marker id="arrExec" markerWidth="11" markerHeight="11" refX="8" refY="5.5" orient="auto">
      <path d="M2,2 L9,5.5 L2,9 Z" fill="#2f8f6b"/>
    </marker>
    <filter id="soft" x="-6%" y="-6%" width="112%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1b1f2a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1080" height="1060" fill="#ffffff"/>

  <!-- Header -->
  <text x="540" y="40" text-anchor="middle" class="title">Pile et flux&#160;: tty &#8596; bash &#8596; application TUI</text>
  <text x="540" y="64" text-anchor="middle" class="subtitle">Du processus à l'écran, un seul flux d'octets mêle le texte (contenu) et les séquences de contrôle (commandes d'affichage).</text>

  <!-- ===================== FLANK ARROWS ===================== -->
  <!-- input : top -> down (left) -->
  <line x1="95" y1="112" x2="95" y2="712" stroke="#2f6f9f" stroke-width="2.4" marker-end="url(#arrDown)"/>
  <text x="46" y="412" transform="rotate(-90 46 412)" text-anchor="middle" class="flank" fill="#2f6f9f">&#9312; ENTRÉE&#160;: frappes clavier &#8594; octets</text>
  <!-- output : bottom -> up (right) -->
  <line x1="985" y1="712" x2="985" y2="112" stroke="#c07d18" stroke-width="2.4" marker-end="url(#arrUp)"/>
  <text x="1035" y="412" transform="rotate(90 1035 412)" text-anchor="middle" class="flank" fill="#c07d18">&#9313; SORTIE&#160;: octets &#8594; glyphes affichés</text>

  <!-- ===================== BOX 1 : EMULATEUR ===================== -->
  <g filter="url(#soft)">
    <rect x="350" y="92" width="380" height="150" rx="12" fill="#eaf2f8" stroke="#2f6f9f" stroke-width="1.6"/>
  </g>
  <rect x="350" y="92" width="6" height="150" rx="3" fill="#2f6f9f"/>
  <text x="372" y="120" class="boxtitle">Émulateur de terminal</text>
  <text x="372" y="140" class="cap mono">xterm · Alacritty · GNOME Terminal</text>
  <text x="372" y="168" class="bullet">•&#160; Rend les glyphes à l'écran</text>
  <text x="372" y="190" class="bullet">•&#160; Encode les touches en octets</text>
  <text x="372" y="212" class="bullet">•&#160; Interprète les séquences reçues</text>
  <text x="372" y="234" class="cap mono" fill="#2f6f9f">détient le maître&#160; /dev/ptmx</text>
  <!-- mini écran -->
  <rect x="600" y="110" width="112" height="96" rx="6" fill="#14161f"/>
  <text x="610" y="132" class="mono" font-size="11" fill="#7fd88f">$ ./app</text>
  <text x="610" y="152" class="mono" font-size="11" fill="#e06c6c">Erreur</text>
  <text x="610" y="172" class="mono" font-size="11" fill="#cfd3dc">état&#160;: 3</text>
  <rect x="610" y="184" width="7" height="13" fill="#7fd88f"/>

  <!-- connector emulateur <-> kernel -->
  <line x1="540" y1="242" x2="540" y2="298" stroke="#8a90a0" stroke-width="1.6" marker-start="url(#arrBi)" marker-end="url(#arrBi)"/>
  <text x="552" y="274" class="conn mono">octets (via maître PTY)</text>

  <!-- ===================== BOX 2 : NOYAU / PTY ===================== -->
  <g filter="url(#soft)">
    <rect x="160" y="300" width="760" height="200" rx="12" fill="#f4f3fc" stroke="#5b52c4" stroke-width="1.6"/>
  </g>
  <rect x="160" y="300" width="760" height="6" rx="3" fill="#5b52c4"/>
  <text x="540" y="330" text-anchor="middle" class="boxtitle" fill="#3a338f">Noyau Linux — pseudo-terminal (PTY) + discipline de ligne</text>

  <!-- maitre -->
  <rect x="178" y="348" width="150" height="132" rx="9" fill="#ffffff" stroke="#b7b1e8" stroke-width="1.3"/>
  <text x="253" y="374" text-anchor="middle" class="bullet" font-weight="700">Maître</text>
  <text x="253" y="396" text-anchor="middle" class="mono" font-size="12" fill="#5b52c4">/dev/ptmx</text>
  <text x="253" y="428" text-anchor="middle" class="cap">côté</text>
  <text x="253" y="444" text-anchor="middle" class="cap">émulateur</text>

  <!-- discipline -->
  <rect x="344" y="348" width="392" height="132" rx="9" fill="#ffffff" stroke="#b7b1e8" stroke-width="1.3"/>
  <text x="362" y="372" class="bullet" font-weight="700">Discipline de ligne (n_tty)</text>
  <text x="362" y="390" class="cap mono">termios · stty · tcsetattr()</text>
  <text x="362" y="414" class="bullet">•&#160; Mode <tspan font-weight="700">canonique</tspan>&#160;: écho, édition de ligne,</text>
  <text x="374" y="431" class="bullet">&#160;&#160;signaux&#160; <tspan class="mono" font-size="12">^C&#8594;SIGINT</tspan></text>
  <text x="362" y="452" class="bullet">•&#160; Mode <tspan font-weight="700">brut</tspan>&#160;: octet par octet, sans écho</text>
  <text x="362" y="472" class="bullet">•&#160; Sortie OPOST&#160;: <tspan class="mono" font-size="12">\n &#8594; \r\n</tspan></text>

  <!-- esclave -->
  <rect x="752" y="348" width="150" height="132" rx="9" fill="#ffffff" stroke="#b7b1e8" stroke-width="1.3"/>
  <text x="827" y="374" text-anchor="middle" class="bullet" font-weight="700">Esclave</text>
  <text x="827" y="396" text-anchor="middle" class="mono" font-size="12" fill="#5b52c4">/dev/pts/N</text>
  <text x="827" y="428" text-anchor="middle" class="cap">=&#160;stdin&#160;/&#160;stdout</text>
  <text x="827" y="444" text-anchor="middle" class="cap">/&#160;stderr</text>

  <!-- connectors kernel <-> processes -->
  <line x1="340" y1="500" x2="340" y2="558" stroke="#8a90a0" stroke-width="1.6" marker-start="url(#arrBi)" marker-end="url(#arrBi)"/>
  <line x1="740" y1="500" x2="740" y2="558" stroke="#8a90a0" stroke-width="1.6" marker-start="url(#arrBi)" marker-end="url(#arrBi)"/>
  <text x="352" y="534" class="conn mono">esclave = descripteurs 0/1/2</text>

  <!-- ===================== BOX 3 : BASH ===================== -->
  <g filter="url(#soft)">
    <rect x="175" y="560" width="330" height="170" rx="12" fill="#e8f5ef" stroke="#2f8f6b" stroke-width="1.6"/>
  </g>
  <rect x="175" y="560" width="6" height="170" rx="3" fill="#2f8f6b"/>
  <text x="197" y="590" class="boxtitle">bash</text>
  <text x="197" y="609" class="cap">shell interactif</text>
  <rect x="392" y="572" width="97" height="22" rx="11" fill="#2f8f6b"/>
  <text x="440" y="587" text-anchor="middle" class="pill" fill="#ffffff">orienté ligne</text>
  <text x="197" y="642" class="bullet">•&#160; Lit des lignes (readline)</text>
  <text x="197" y="666" class="bullet">•&#160; Émet&#160;: prompt, couleurs SGR</text>
  <text x="197" y="690" class="bullet">•&#160; Lance l'appli&#160;: <tspan class="mono" font-size="12">fork() + exec()</tspan></text>
  <text x="197" y="716" class="cap mono" fill="#2f8f6b">attaché à /dev/pts/N</text>

  <!-- bash -> TUI (fork/exec) -->
  <line x1="505" y1="600" x2="573" y2="600" stroke="#2f8f6b" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrExec)"/>
  <text x="539" y="592" text-anchor="middle" class="conn" fill="#2f8f6b" font-weight="700">exec</text>

  <!-- ===================== BOX 4 : TUI ===================== -->
  <g filter="url(#soft)">
    <rect x="575" y="560" width="330" height="170" rx="12" fill="#fbf1dd" stroke="#c07d18" stroke-width="1.6"/>
  </g>
  <rect x="575" y="560" width="6" height="170" rx="3" fill="#c07d18"/>
  <text x="597" y="588" class="boxtitle">Application TUI</text>
  <text x="597" y="606" class="cap">vim · tmux · Textual</text>
  <rect x="792" y="570" width="97" height="22" rx="11" fill="#c07d18"/>
  <text x="840" y="585" text-anchor="middle" class="pill" fill="#ffffff">mode brut</text>
  <text x="597" y="630" class="bullet">•&#160; Passe en <tspan font-weight="700">mode brut</tspan> (tcsetattr)</text>
  <text x="597" y="650" class="bullet">•&#160; Écran alternatif&#160; <tspan class="mono" font-size="12">\e[?1049h</tspan></text>
  <text x="597" y="670" class="bullet">•&#160; Curseur masqué&#160; <tspan class="mono" font-size="12">\e[?25l</tspan></text>
  <text x="597" y="690" class="bullet">•&#160; Pilote l'affichage par séquences</text>
  <text x="597" y="710" class="bullet">•&#160; Lit les octets bruts&#160;: flèches, souris</text>

  <!-- ===================== BYTE STREAM PANEL ===================== -->
  <g filter="url(#soft)">
    <rect x="70" y="792" width="940" height="252" rx="14" fill="#14161f" stroke="#2b2f3d" stroke-width="1.4"/>
  </g>
  <text x="92" y="822" font-size="15" font-weight="700" fill="#eef0f5">&#9313;&#160; Le flux d'octets vers l'affichage — un seul canal, contenu et commandes mêlés</text>

  <!-- legend -->
  <rect x="92" y="842" width="13" height="13" rx="2.5" fill="#7fd88f"/>
  <text x="114" y="853" class="mono" font-size="12.5" fill="#cdd2dd">Texte imprimable (UTF-8) — le contenu</text>
  <rect x="540" y="842" width="13" height="13" rx="2.5" fill="#f2c14e"/>
  <text x="562" y="853" class="mono" font-size="12.5" fill="#cdd2dd">Contrôles C0&#160;:&#160; \n&#160;&#160;\r&#160;&#160;\t&#160;&#160;\b&#160;&#160;\a&#160;(BEL)&#160;&#160;\e&#160;(ESC)</text>
  <rect x="92" y="868" width="13" height="13" rx="2.5" fill="#f2c14e"/>
  <text x="114" y="879" class="mono" font-size="12.5" fill="#cdd2dd">CSI&#160; \e[&#160;…&#160; — curseur, couleurs (SGR), effacement, modes</text>
  <rect x="540" y="868" width="13" height="13" rx="2.5" fill="#f2c14e"/>
  <text x="562" y="879" class="mono" font-size="12.5" fill="#cdd2dd">OSC&#160; \e]&#160;…&#160; — titre de fenêtre, couleurs, hyperliens</text>

  <line x1="92" y1="896" x2="988" y2="896" stroke="#2b2f3d" stroke-width="1.2"/>

  <text x="92" y="920" class="mono" font-size="12" fill="#8a90a0">Exemple de flux émis par l'application&#160;:</text>
  <!-- example line, color coded -->
  <text x="92" y="950" class="mono" font-size="18">
    <tspan fill="#f2c14e">\e[H</tspan><tspan fill="#f2c14e">\e[2J</tspan><tspan fill="#f2c14e">\e[1;31m</tspan><tspan fill="#7fd88f">Erreur</tspan><tspan fill="#f2c14e">\e[0m</tspan><tspan fill="#8a90a0">\n</tspan>
  </text>

  <!-- decode, two columns -->
  <text x="92" y="982"  class="mono" font-size="13"><tspan fill="#f2c14e">\e[H</tspan><tspan fill="#cdd2dd">&#160;&#160;&#160;&#160;&#160; &#8594; curseur en (1,1)</tspan><tspan fill="#6b7180">&#160;&#160;·CUP</tspan></text>
  <text x="92" y="1004" class="mono" font-size="13"><tspan fill="#f2c14e">\e[2J</tspan><tspan fill="#cdd2dd">&#160;&#160;&#160;&#160; &#8594; efface tout l'écran</tspan><tspan fill="#6b7180">&#160;&#160;·ED</tspan></text>
  <text x="92" y="1026" class="mono" font-size="13"><tspan fill="#f2c14e">\e[1;31m</tspan><tspan fill="#cdd2dd">&#160; &#8594; gras + rouge</tspan><tspan fill="#6b7180">&#160;&#160;·SGR</tspan></text>

  <text x="560" y="982"  class="mono" font-size="13"><tspan fill="#7fd88f">Erreur</tspan><tspan fill="#cdd2dd">&#160;&#160;&#160; &#8594; affiché tel quel</tspan><tspan fill="#6b7180">&#160;&#160;·texte</tspan></text>
  <text x="560" y="1004" class="mono" font-size="13"><tspan fill="#f2c14e">\e[0m</tspan><tspan fill="#cdd2dd">&#160;&#160;&#160;&#160; &#8594; réinitialise les attributs</tspan><tspan fill="#6b7180">&#160;&#160;·SGR</tspan></text>
  <text x="560" y="1026" class="mono" font-size="13"><tspan fill="#8a90a0">\n</tspan><tspan fill="#cdd2dd">&#160;&#160;&#160;&#160;&#160;&#160; &#8594; nouvelle ligne</tspan><tspan fill="#6b7180">&#160;&#160;·C0</tspan></text>
</svg>
